prefix: "<dark_gray>[<gradient:red:gold>BasaltRanks</gradient>]</dark_gray> <gray>"
no-permission: "{prefix}<red>You don't have permission."
players-only: "{prefix}<red>This command is for players only."
badge-created: "{prefix}<green>Badge <white>{id}</white> created successfully."
badge-deleted: "{prefix}<green>Badge <white>{id}</white> deleted."
badge-not-found: "{prefix}<red>Badge <white>{id}</white> not found."
badge-exists: "{prefix}<red>Badge <white>{id}</white> already exists."
badge-assigned: "{prefix}<green>Badge <white>{badge}</white> assigned to <white>{player}</white>."
badge-assigned-suffix: "{prefix}<green>Suffix badge <white>{badge}</white> assigned to <white>{player}</white>."
badge-removed: "{prefix}<green>Badge removed from <white>{player}</white>."
badge-removed-prefix: "{prefix}<green>Prefix badge removed from <white>{player}</white>."
badge-removed-suffix: "{prefix}<green>Suffix badge removed from <white>{player}</white>."
badge-removed-all: "{prefix}<green>All badges removed from <white>{player}</white>."
badge-list-header: "{prefix}<gold>Badges ({count}):"
badge-list-entry: "  <gray>- <white>{id}</white> <dark_gray>({text})"
badge-list-empty: "{prefix}<gray>No badges created yet."
player-not-found: "{prefix}<red>Player <white>{player}</white> not found."
pack-generating: "{prefix}<yellow>Generating resource pack..."
pack-ready: "{prefix}<green>Resource pack ready!"
pack-sent: "{prefix}<green>Resource pack sent to all online players."
config-reloaded: "{prefix}<green>Configuration reloaded."
invalid-usage: "{prefix}<red>Usage: <white>{usage}"
version-info: "{prefix}<white>BasaltRanks <gold>v{version} <gray>by <white>Turok_SS"

# Editor GUI messages
editor-type-text: "{prefix}<yellow>Type the badge display text in chat <gray>(or 'cancel'):"
editor-type-hex: "{prefix}<yellow>Type a hex color in chat <gray>(format: #RRGGBB, or 'cancel'):"
editor-cancelled: "{prefix}<gray>Editing cancelled."
editor-saved: "{prefix}<green>Badge <white>{id}</white> saved and resource pack regenerated."
editor-no-badge: "{prefix}<red><white>{player}</white> has no badge assigned."
editor-delete-confirm: "{prefix}<yellow>Badge <white>{id}</white> is assigned to <white>{count}</white> players. Run <white>/badge delete {id} confirm</white> to proceed."

# Web editor messages
web-enabled: "{prefix}<green>Web editor <white>enabled</white> at <click:open_url:'{url}'><underlined><white>{url}</white></underlined></click>"
web-disabled: "{prefix}<yellow>Web editor <white>disabled</white>. Resource pack still active."
web-already-on: "{prefix}<gray>Web editor is already enabled."
web-already-off: "{prefix}<gray>Web editor is already disabled."
web-status-header: "{prefix}<gold>Web Editor Status:"
web-status-on: "  <gray>Status: <green>ENABLED"
web-status-off: "  <gray>Status: <red>DISABLED"
web-status-url: "  <gray>URL: <click:open_url:'{url}'><underlined><white>{url}</white></underlined></click>"
web-status-toggle: "  <gray>Toggle: <white>/badge web on|off"

# Animation messages
animation-enabled: "{prefix}<green>Animation <white>{type}</white> enabled for <white>{id}</white> ({frames} frames, {speed}t speed)"
animation-disabled: "{prefix}<yellow>Animation disabled for <white>{id}</white>"
animation-types: "{prefix}<gray>Types: <white>rainbow, pulse, glow, gradient_shift"
